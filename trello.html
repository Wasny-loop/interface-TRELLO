<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interface de login do Trello</title>

    <!--
      <script src="https://unpkg.com/@codans/trello"></script>
    -->

    <script src="https://unpkg.com/@codans/trello"></script>

</head>
<body>

  <!-- Imagens maiores com tamanho 200px e menores com tamanho 20px-->
  <img src="img/trello.svg" alt="logo da trello" width="200px">
  <h1>Fazer login na Trello</h1>

  <form action="" method="GET">

    <input type="text" name="email" placeholder="Digite seu email"> 
    <input type="password" name="senha" placeholder="Digite sua senha"> 

    <input type="submit" value="Fazer login"> 

    <!-- Span - é utilizado para exibir pouco texto -->
    <span>OU</span> 

    <button type="submit">
      <img src="img/google.svg" width="20px" alt="Google">Continuar com o Google
    </button> 

    <button type="submit">
      <img src="img/microsoft.svg" width="20px" alt="Microsoft">Continuar com o Microsoft
    </button> 

    <button type="submit">
      <img src="img/apple.svg" width="20px" alt="Apple">Continuar com a Apple
    </button> 

    <button type="submit">
      <img src="img/slack.svg" width="20px" alt="Slack">Continuar com o Slack
    </button> 

  </form>

  <img src="img/atlassian.svg" width="200px" alt="Atlassian">
  <img src="img/analytics.svg" width="200px" alt="Analytics">
  <img src="img/interactive.svg" width="200px" alt="Interactive">

</body>
</html>
